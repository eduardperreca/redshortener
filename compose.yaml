# docker compose up -d --build    app on http://localhost:8080, with Postgres and Redis
# docker compose up -d postgres redis    only the stores, to run the app with go run .

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://redshortener:redshortener@postgres:5432/redshortener
      REDIS_ADDR: redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: redshortener
      POSTGRES_PASSWORD: redshortener
      POSTGRES_DB: redshortener
    # Published on localhost only: Redis has no password, and Postgres uses
    # the one in this file.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    # -h localhost: while the image initializes a new data directory, it runs a
    # temporary server on the Unix socket only, which must not count as ready.
    healthcheck:
      test: pg_isready -h localhost -U redshortener
      interval: 1s
      start_period: 60s

  # Redis is a cache here: bounded memory and no persistence, since everything
  # in it can be rebuilt from Postgres. volatile-lfu only evicts keys with a
  # TTL, so the pending click counts (no TTL) are never evicted, and it keeps
  # frequently used links over recently used ones.
  redis:
    image: redis:8
    command: redis-server --maxmemory 100mb --maxmemory-policy volatile-lfu --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
