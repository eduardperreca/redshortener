<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>redshortener</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #d6d3d1;
    --accent: #b91c1c; --accent-fg: #fff; --field: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c;
            --accent: #ef4444; --accent-fg: #1c1917; --field: #292524; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, sans-serif; padding: 16px;
  }
  main { width: 100%; max-width: 34rem; }
  h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
  form { display: grid; grid-template-columns: 1fr auto; gap: .5rem; }
  label { grid-column: 1 / -1; font-size: .875rem; color: var(--muted); }
  input, select, button {
    font: inherit; padding: .625rem .75rem; border-radius: 6px;
    border: 1px solid var(--line); background: var(--field); color: var(--fg);
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); cursor: pointer; }
  #result { margin-top: 1.5rem; min-height: 3rem; }
  .link { display: flex; gap: .5rem; align-items: center; }
  .link a { color: var(--fg); font-weight: 600; word-break: break-all; }
  .link button { background: transparent; color: var(--fg); border-color: var(--line); padding: .25rem .625rem; }
  .error { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>redshortener</h1>
  <form id="form">
    <label for="url">Long URL</label>
    <input id="url" name="url" type="url" required placeholder="https://example.com/a/very/long/path">
    <button>Shorten</button>
    <label for="expires">Expires</label>
    <select id="expires" name="expires">
      <option value="0">Never</option>
      <option value="3600">After 1 hour</option>
      <option value="86400">After 1 day</option>
      <option value="604800">After 7 days</option>
      <option value="2592000">After 30 days</option>
    </select>
  </form>
  <div id="result" aria-live="polite"></div>
</main>
<script>
  const form = document.getElementById("form");
  const result = document.getElementById("result");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    result.replaceChildren();
    const res = await fetch("/api/links", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: form.url.value, expires_in: Number(form.expires.value) }),
    });
    const body = await res.json().catch(() => ({ error: res.statusText }));
    if (!res.ok) {
      const p = document.createElement("p");
      p.className = "error";
      p.textContent = res.status === 429 ? "Too many links. Try again in a few seconds." : body.error;
      result.append(p);
      return;
    }

    const div = document.createElement("div");
    div.className = "link";
    const a = document.createElement("a");
    a.href = a.textContent = body.short_url;
    const copy = document.createElement("button");
    copy.type = "button";
    copy.textContent = "Copy";
    copy.onclick = async () => {
      await navigator.clipboard.writeText(body.short_url);
      copy.textContent = "Copied";
    };
    div.append(a, copy);
    result.append(div);
  });
</script>
</body>
</html>
