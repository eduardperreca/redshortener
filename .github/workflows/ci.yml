name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: redshortener
          POSTGRES_PASSWORD: redshortener
          POSTGRES_DB: redshortener
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U redshortener" --health-interval 1s --health-retries 30
      redis:
        image: redis:8
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://redshortener:redshortener@localhost:5432/redshortener
      REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # The latest patch release, which govulncheck checks below.
          go-version: "1.26"
          check-latest: true
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: go test -race ./...
      - run: docker build .
